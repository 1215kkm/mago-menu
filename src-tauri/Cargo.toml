[package]
name = "mago"
version = "0.1.6"
description = "MAGO — 탐색기에서 Shift 를 누른 채 파일을 끌면 뜨는 원형 메뉴와 쓰레기통"
authors = ["1215kkm"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mago_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 화면(ui/)을 exe 에 늘 품는다 — 개발 서버(devUrl) 없이 `cargo run` 만으로 돈다.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"   # 숨은 방 [자세히 보기] — content.json 에 적힌 https 링크만 (content.rs open_link)
tauri-plugin-updater = "2"  # GitHub Releases latest.json + minisign 서명 검증 (updater.rs)
tauri-plugin-process = "2"  # 업데이트 설치 뒤 다시 켜기
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
winreg = "0.55"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "wav", "pcm"] }
mp3lame-encoder = "0.2.5"
# 컴뚝딱과 같은 Windows API 묶음 (필요 없는 것도 섞여 있다 — 정리는 나중에)
windows = { version = "0.61", features = [
  "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Registry",
  # 10-16 PDF → 그림 (imagery/pdf_render.rs) — Windows 에 들어 있는 PDF 그리기. 설치 파일에 더하는 것 없음.
  "Foundation", "Data_Pdf", "Storage", "Storage_Streams",
  # 10-19 끌다가 바로 바꾸기 (imagery/quick.rs) — 놓기를 받는 둥근 창(OLE IDropTarget). 놓을 때 언제나 "복사" 로 답해 원본이 지워지지 않게.
  # wry 가 같은 버전에 이미 켠 기능들이라 빌드가 늘지 않는다.
  "Win32_System_Com_StructuredStorage", "Win32_System_SystemServices", "Win32_System_LibraryLoader",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi",
  # 위 놓기 창 테스트가 탐색기와 같은 셸 끌기 데이터(SHCreateDataObject)를 만들 때 쓰는 항목 목록 형식
  "Win32_UI_Shell_Common",
  # 10-20 누끼 (cutout.rs) — 윈도우에 들어 있는 기계 학습 엔진(Windows ML)으로 이 PC 에서 배경 지우기
  "AI_MachineLearning", "Foundation_Collections",
  # 10-28 브라우저 끌기 데이터 읽기 (ring.rs drop_win) — 주소·그림 형식 이름(RegisterClipboardFormatW) · 내용(GlobalLock)
  "Win32_System_DataExchange", "Win32_System_Memory",
] }
# 놓기 창의 IDropTarget 을 만드는 #[implement] 매크로가 `windows_core` 이름으로 찾는다 (wry 와 같은 0.61 — 새로 받는 것 없음)
windows-core = "0.61"
windows-sys = { version = "0.61", features = [
  # Win32_Security_Authorization: 복구 도우미 파이프 DACL 을 "현재 사용자만" 으로 만드는 SDDL 변환(ConvertStringSecurityDescriptorToSecurityDescriptorW·ConvertSidToStringSidW).
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl",
  "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
  # v1.3 붙임 모드 (window/) — 모니터 목록·작업 영역(Gdi), 모니터별 배율(HiDpi), 다른 가상 데스크톱 판정(Dwm: DWMWA_CLOAKED).
  # 전부 *읽기* 와 *창 위치* 호출뿐이다. 프로세스를 끝내거나 입력을 보내는 API 는 쓰지 않는다.
  # Win32_System_LibraryLoader: 항상 위(topmost) Z 순서 실측 테스트가 시험 창을 만들 때만 쓴다.
  "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader",
  # v1.4 기본 저장 폴더 — SHGetKnownFolderPath(FOLDERID_Documents) + 그 문자열 해제(CoTaskMemFree).
  "Win32_System_Com",
  # 09-30 내 단축키 (photoshop/hotkeys.rs) — 포토샵이 맨 앞일 때 누른 조합 읽기(GetAsyncKeyState) +
  # 고정한 단축키를 포토샵에 한 번 보내기(SendInput). 사용자가 누를 때만 보낸다.
  "Win32_UI_Input_KeyboardAndMouse",
  # 10-01 포토샵에서 손을 쓰는 중엔 상태를 묻지 않기 — 마지막 입력 시각(GetLastInputInfo)과 비교할 현재 시각(GetTickCount).
  "Win32_System_SystemInformation",
  # 10-01 구글 드라이브 — 로그인 유지 열쇠를 이 Windows 계정만 풀 수 있게 암호화(DPAPI CryptProtectData) + PKCE 난수(BCryptGenRandom).
  "Win32_Security_Cryptography",
  # 10-20 누끼 도구 처음 받기 (cutout.rs) — 윈도우 프록시 설정을 따르는 WinHTTP. 받은 파일은 위 BCrypt SHA-256 으로 확인
  "Win32_Networking_WinHttp",
  # 10-28 인터넷에서 끌어 받기 (web.rs) — 카톡에 붙여 넣을 파일·링크를 클립보드에 (OpenClipboard · GlobalAlloc)
  "Win32_System_DataExchange", "Win32_System_Memory",
] }
# 10-20 글(TXT) → Word · 한글(HWPX) · 엑셀 (text.rs) — 셋 다 zip 묶음. 업데이터가 이미 쓰는 zip 과 zlib-rs 라 새로 받는 것 없음
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# 메모장 'ANSI'(CP949)로 저장한 TXT 읽기 — tauri 가 이미 쓰는 것
encoding_rs = "0.8"
# 글 → PDF (pdfprint.rs) — 화면 엔진(WebView2)의 'PDF 로 인쇄'. tauri(wry) 와 같은 판
webview2-com = "0.39"
windows-core-62 = { package = "windows-core", version = "0.62" }
# 10-24 여러 종류를 한 PDF 로 (mix.rs) — PDF 잇기 · 그림 쪽 만들기. 기본 기능(chrono·rayon 등)은 끈다
lopdf = { version = "0.36.0", default-features = false }
# 10-24 Word·엑셀·한글이 없을 때 docx·xlsx·hwpx 에서 글만 꺼내기 (office.rs) — plist 가 이미 쓰는 판이라 새로 받는 것 없음
quick-xml = "0.42"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
